<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auris PDF</title>
    <link rel="icon" type="image/png" href="/brand/mark.png" />
    <!-- tela de abertura: aparece no primeiro quadro, antes do app carregar -->
    <style>
      html, body { margin: 0; height: 100%; background: #031d38; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(ellipse at center, #0a3a69 0%, #031d38 70%); transition: opacity .35s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { width: 92px; height: 92px; animation: splash-pulse 1.6s ease-in-out infinite; }
      #splash .logo { height: 30px; opacity: .92; }
      #splash .bar { width: 160px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #2f80ed, #5aa2f5); animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(1.06); filter: drop-shadow(0 0 18px rgba(90,162,245,.45)); } }
      @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img class="mark" src="/brand/mark.png" alt="" />
      <img class="logo" src="/brand/logo.png" alt="Auris" />
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
